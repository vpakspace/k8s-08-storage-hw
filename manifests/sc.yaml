---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-sc
# no-provisioner: тома автоматически не создаются, PV для этого класса готовит администратор вручную
provisioner: kubernetes.io/no-provisioner
# привязка PVC к PV откладывается до появления Pod'а, которому том нужен (ему выбирается узел)
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-sc-pvc
spec:
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-sc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-sc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange-sc
  template:
    metadata:
      labels:
        app: data-exchange-sc
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                echo "$(date '+%F %T') line from busybox (SC)" >> /data/out.txt
                sleep 5
              done
          volumeMounts:
            - name: sc-storage
              mountPath: /data
        - name: multitool
          image: wbitt/network-multitool:3.24.4
          volumeMounts:
            - name: sc-storage
              mountPath: /data
              readOnly: true
      volumes:
        - name: sc-storage
          persistentVolumeClaim:
            claimName: data-sc-pvc
